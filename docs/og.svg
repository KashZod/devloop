<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1c"/>
      <stop offset="1" stop-color="#141a38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8f8cff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(80,86)">
    <rect width="60" height="60" rx="14" fill="#0a0e1c" stroke="#8f8cff" stroke-opacity="0.4"/>
    <g transform="scale(1.875)" fill="none" stroke="#8f8cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="9" r="1.6" fill="#8f8cff" stroke="none"/>
      <circle cx="11" cy="16" r="1.6" fill="#8f8cff" stroke="none"/>
      <circle cx="11" cy="23" r="1.6" fill="#8f8cff" stroke="none"/>
      <path d="M11 9h9M11 16h9M11 23h9"/>
      <path d="M23 23c3.4 0 3.4-14 0-14" opacity=".9"/>
      <path d="M25 6.5 23 9l2.6 1.4"/>
    </g>
    <text x="80" y="42" font-size="34" font-weight="700" fill="#e7e9f6" letter-spacing="-1">devloop</text>
  </g>

  <!-- kicker -->
  <text x="80" y="288" font-family="'IBM Plex Mono',monospace" font-size="22" letter-spacing="4" fill="#8f8cff">TEST-DRIVEN LOOP FOR CODING AGENTS</text>

  <!-- headline -->
  <text x="76" y="378" font-size="86" font-weight="700" fill="#e7e9f6" letter-spacing="-3">Plan before code.</text>
  <text x="76" y="470" font-size="86" font-weight="700" letter-spacing="-3"><tspan fill="#8f8cff">Prove</tspan><tspan fill="#e7e9f6" dx="26">before commit.</tspan></text>

  <!-- subline -->
  <text x="80" y="548" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="27" fill="#9297b7">Three commands, three gates, and review agents that never wrote the code.</text>

  <!-- gated pipeline motif, right -->
  <g transform="translate(930,150)" stroke="#8f8cff" fill="none" stroke-width="4" stroke-linecap="round">
    <line x1="30" y1="0" x2="30" y2="330" stroke-opacity="0.8"/>
    <g>
      <circle cx="30" cy="20" r="18" fill="#0f1428"/>
      <circle cx="30" cy="165" r="18" fill="#0f1428"/>
      <circle cx="30" cy="310" r="18" fill="#0f1428"/>
    </g>
    <g stroke-width="3">
      <rect x="18" y="80" width="24" height="24" rx="5" transform="rotate(45 30 92)"/>
      <path d="M23 92l4 4 8-9" stroke-width="3"/>
      <rect x="18" y="225" width="24" height="24" rx="5" transform="rotate(45 30 237)"/>
      <path d="M23 237l4 4 8-9" stroke-width="3"/>
    </g>
    <path d="M8 310 C -34 292, -34 42, 6 24" stroke-dasharray="5 7" stroke-width="3" stroke-opacity="0.85"/>
  </g>
  <g font-family="'IBM Plex Mono',monospace" font-size="20" fill="#9297b7" text-anchor="start">
    <text x="992" y="177">1 spec</text>
    <text x="992" y="322">2 plan</text>
    <text x="992" y="467">3 implement</text>
  </g>
</svg>
